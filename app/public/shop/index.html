<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WEB SHOP | DAY$ SHOP</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    background: #fff;
    color: #111;
  }
  a { color: inherit; text-decoration: none; }

  header {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #000;
    color: #fff;
    border-radius: 999px;
    display: flex;
    align-items: center;
    height: 52px;
    padding: 0 8px 0 20px;
    z-index: 100;
    gap: 24px;
  }
  header .logo { font-size: 16px; letter-spacing: 0.5px; display: flex; align-items: center; }
  header .logo img { height: 34px; display: block; }
  header nav { display: flex; gap: 20px; height: 100%; }
  header nav a {
    display: flex;
    align-items: center;
    font-size: 13px;
    padding: 0 10px;
  }
  header nav a:hover { color: #999; }
  header nav a.active { text-decoration: underline; }

  .categories {
    max-width: 1200px;
    margin: 0 auto;
    padding: 110px 24px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    font-size: 13px;
  }
  .categories a { color: #999; }
  .categories a.active { color: #111; text-decoration: underline; }

  .grid {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 2px;
  }

  .tile { display: block; }
  .tile .thumb {
    background: #f4f4f4;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .tile .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .tile .thumb:hover img { opacity: 0.85; }
  .tile .name { font-size: 12px; margin-top: 10px; }
  .tile .price { font-size: 12px; color: #999; margin-top: 2px; text-transform: none; }

  footer {
    text-align: center;
    font-size: 11px;
    color: #999;
    padding: 30px 24px;
    text-transform: none;
    font-weight: 400;
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="https://daysworldwide.me" target="_blank" rel="noopener noreferrer">
    <img src="day-logo.png" alt="DAY$ Worldwide" />
  </a>
  <nav>
    <a href="home.html">Home</a>
    <a href="index.html">Shop All</a>
    <a href="index.html#tees">New Arrivals</a>
    <a href="https://open.spotify.com/track/4e5f4kvBdFKzr3zeGFjzk2?si=3a070caa5b8c4365" target="_blank" rel="noopener noreferrer">Advice</a>
    <a href="mailto:daysworldwide@gmail.com">Contact</a>
  </nav>
</header>

<div class="categories">
  <a class="cat-btn active" href="#" data-category="all">All</a>
  <a class="cat-btn" href="#" data-category="tees">Tees</a>
</div>

<div class="grid">
  <a class="tile" href="product.html" data-category="tees">
    <div class="thumb">
      <img src="day-front.png" alt="Different Day$ Tee - Black" />
    </div>
    <div class="name">Different Day$ Tee - Black</div>
    <div class="price">$40.00</div>
  </a>
</div>

<footer>
  Day$ Worldwide 2026. Bay Area to the World
</footer>

<script>
  function applyCategory(category) {
    document.querySelectorAll(".cat-btn").forEach((b) => {
      b.classList.toggle("active", b.dataset.category === category);
    });
    document.querySelectorAll(".tile").forEach((tile) => {
      tile.style.display = category === "all" || tile.dataset.category === category ? "" : "none";
    });
  }

  document.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      applyCategory(btn.dataset.category);
    });
  });

  const initialCategory = window.location.hash.replace("#", "");
  if (initialCategory && document.querySelector(`.cat-btn[data-category="${initialCategory}"]`)) {
    applyCategory(initialCategory);
  }
</script>

</body>
</html>
